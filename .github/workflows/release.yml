name: Release production version

on:
  pull_request:
    types: [closed]
    branches:
      - dev

jobs:
  build-plugin:
    name: Build with Node
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/ui-color-palette/')
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'recursive'
        fetch-depth: 0
    
    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize and update submodules
      run: |
        git submodule update --init --recursive --force

    - name: Create .env.local file
      run: |
        touch .env.local
        echo VITE_SUPABASE_URL="${{ vars.VITE_SUPABASE_URL }}" >> .env.local
        echo VITE_SUPABASE_PUBLIC_ANON_KEY="${{ secrets.VITE_SUPABASE_PUBLIC_ANON_KEY }}" >> .env.local
        echo VITE_SENTRY_DSN="${{ vars.VITE_SENTRY_DSN }}" >> .env.local
        echo VITE_MIXPANEL_TOKEN="${{ secrets.VITE_MIXPANEL_TOKEN }}" >> .env.local
        echo VITE_AUTH_WORKER_URL="${{ vars.VITE_AUTH_WORKER_URL }}" >> .env.local
        echo VITE_AUTH_URL="${{ vars.VITE_AUTH_URL }}" >> .env.local
        echo VITE_ANNOUNCEMENTS_WORKER_URL="${{ vars.VITE_ANNOUNCEMENTS_WORKER_URL }}" >> .env.local
        echo VITE_NOTION_ANNOUNCEMENTS_ID="${{ vars.VITE_NOTION_ANNOUNCEMENTS_ID }}" >> .env.local
        echo VITE_NOTION_ONBOARDING_ID="${{ vars.VITE_NOTION_ONBOARDING_ID }}" >> .env.local
        cat .env.local
        touch .env.sentry-build-plugin
        echo SENTRY_AUTH_TOKEN="${{ secrets.SENTRY_AUTH_TOKEN }}" >> .env.sentry-build-plugin
        cat .env.sentry-build-plugin

    - name: Clean install
      run: |
        rm -rf node_modules package-lock.json

    - name: Install and Build
      run: |
        npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
        npm install
        npm run build:prod:all

    - name: Verify build output
      run: |
        echo "=== Checking file sizes and structure ==="
        ls -la fig/dist/ || echo "fig/dist directory not found!"
        ls -la one/dist/ || echo "one/dist directory not found!"
        du -sh fig/dist/* fig/manifest.json || echo "Error checking fig file sizes"
        du -sh one/dist/* one/manifest.json || echo "Error checking one file sizes"
        
    - name: Archive /figma production artifact
      uses: actions/upload-artifact@v4
      with:
        name: figma-fig-ui-color-palette
        path: |
          fig/dist/index.html
          fig/dist/plugin.js
          fig/manifest.json
        retention-days: 5

    - name: Archive /one production artifact
      uses: actions/upload-artifact@v4
      with:
        name: figma-one-ui-color-palette
        path: |
          one/dist/index.html
          one/dist/plugin.js
          one/manifest.json
        retention-days: 5
        
  create-release:
    name: Create release
    needs: build-plugin
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/ui-color-palette/')
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download /figma build artifact
      uses: actions/download-artifact@v4
      with:
        name: figma-fig-ui-color-palette
        path: ./figma-fig-ui-color-palette

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: figma-one-ui-color-palette
        path: ./figma-one-ui-color-palette

    - name: Verify downloaded artifacts
      run: |
        echo "=== Checking downloaded artifacts ==="
        find ./figma-fig-ui-color-palette -type f -exec ls -la {} \;
        find ./figma-one-ui-color-palette -type f -exec ls -la {} \;
        
    - name: Zip /figma plugin
      run: |
        zip -r figma-fig-ui-color-palette.zip fig/dist fig/manifest.json

    - name: Zip /one plugin
      run: |
        zip -r figma-one-ui-color-palette.zip one/dist one/manifest.json

    - name: Extract package version
      id: extract_version
      run: |
        package_version=$(jq -r '.version' package.json)
        echo "package_version=$package_version" >> $GITHUB_OUTPUT

    - name: Remove dots from version
      id: remove_dot_version
      run: |
        version_nopoint=$(echo "${{ steps.extract_version.outputs.package_version }}" | tr -d '.')
        echo "version_nopoint=$version_nopoint" >> $GITHUB_OUTPUT

    - name: Create release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.extract_version.outputs.package_version }}
        release_name: ${{ github.event.pull_request.title}}
        body: |
          ## What's Changed
          [Friendly release note](https://ui-color-palette.canny.io/changelog/ui-color-palette-${{ steps.remove_dot_version.outputs.version_nopoint }})

    - name: Upload plugin as release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: figma-fig-ui-color-palette.zip
        asset_name: figma-fig-ui-color-palette.zip
        asset_content_type: application/zip

    - name: Upload plugin as release asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: figma-one-ui-color-palette.zip
        asset_name: figma-one-ui-color-palette.zip
        asset_content_type: application/zip
